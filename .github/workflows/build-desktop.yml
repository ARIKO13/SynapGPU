name: Build Desktop EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd desktop
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          cd desktop
          pyinstaller SynapGPU.spec --noconfirm --clean

      - name: Rename folder
        run: |
          Move-Item desktop\dist\SynapGPU desktop\dist\SynapGPU-Windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynapGPU-Windows
          path: desktop/dist/SynapGPU-Windows/
          retention-days: 90

      - name: Create zip for release
        run: |
          Compress-Archive -Path desktop\dist\SynapGPU-Windows\* -DestinationPath desktop\dist\SynapGPU-Windows.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/SynapGPU-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
